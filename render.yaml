# Render Blueprint: one free web service. Secrets are entered in the Render
# dashboard (sync: false), never stored here.
services:
  - type: web
    name: guitar-app
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && sh scripts/install-yt-dlp.sh
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: EDITOR_PASSCODE
        sync: false
      # Password shared with the YouTube helper on the teacher's home computer.
      - key: HELPER_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
